version = 3.8.3
runner.dialect = scala213

# scalafmt cross-runs against 2.12 and 2.13 sources; scala213 is a strict
# superset of scala212 syntax for the constructs used in this project, so it
# is safe for both binary versions.
fileOverride {
  "glob:**/src/main/scala-2.12/**" {
    runner.dialect = scala212
  }
  "glob:**/src/test/scala-2.12/**" {
    runner.dialect = scala212
  }
}

maxColumn = 120
align.preset = none
align.openParenCallSite = false
align.openParenDefnSite = false

continuationIndent.callSite = 2
continuationIndent.defnSite = 2

newlines.topLevelStatements = [before, after]
newlines.beforeMultiline = unfold
newlines.alwaysBeforeMultilineDef = false

docstrings.style = SpaceAsterisk
docstrings.wrap = no

rewrite.rules = [
  AvoidInfix,
  RedundantBraces,
  RedundantParens,
  SortImports,
  PreferCurlyFors
]

rewrite.redundantBraces.stringInterpolation = true
rewrite.redundantBraces.maxLines = 1

project.git = true
project.excludeFilters = [
  "target/"
]
